    if(s>0&&s>(c[k]?.[0]||0))c[k]=[s,u.href]};

let idx;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:24px 16px 60px}

// ---------- saving (app: Documents folder, browser: memory + ZIP)
async function save(path,s){const N=1500000;let i=0,first=true;

function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e4)}
const getZip=()=>dl((folder||'novelgrab')+'.zip',zip(mem));
let sq=Promise.resolve();   // one file write at a time; queued writes are dropped the moment Stop is pressed
const qsave=(path,s)=>{const p=sq.then(()=>stop?Promise.reject(new Error('stopped')):save(path,s));sq=p.catch(()=>{});return p};
let mq=Promise.resolve();
const saveMan=()=>APP?(mq=mq.then(()=>save(`NovelGrab/${folder}/manifest.json`,JSON.stringify(items.filter(i=>i.file).map(i=>({n:i.n,title:i.title,url:i.url,file:i.file,keys:i.keys,note:i.note}))))).catch(()=>{})):0;
async function work(it,html,url,mode,clean,prev){

    if(prev)prev.keys.forEach(k=>map[k]=P);if(nx)nx.keys.forEach(k=>map[k]=N);

// ---------- crawl
async function start(){
  let url=$('u').value.trim().replace(/^["']|["']$/g,'');if(!url)return;if(!/^https?:\/\//i.test(url))url='https://'+url;
  const limit=+$('limit').value||0,workers=+$('workers').value,delay=+$('delay').value||0,mode=$('images').value,clean=$('clean').value=='1';
  items=[];logs=[];mem={};stop=false;paused=false;run=true;stopP=new Promise(f=>stopRes=f);$('go').hidden=true;$('pb').hidden=$('sb').hidden=false;$('pb').textContent='Pause';$('sb').disabled=false;$('sb').textContent='Stop';

  let wl;try{wl=await navigator.wakeLock.request('screen')}catch{}

  run=false;paused=false;$('go').hidden=false;$('pb').hidden=$('sb').hidden=true;try{wl&&wl.release()}catch{}BG&&BG.stop().catch(()=>{});
  log(stop?'Stopped.':'Finished.');log(done.length+(APP?' saved to Documents/NovelGrab/'+folder:' pages ready - press Download ZIP'))}
// ---------- UI

  $('sum').textContent=d+' saved / '+t+' found'+(run?(down?' - waiting for internet':paused?' - paused':stop?' - stopping...':' - running (keep this page open)'):t?(APP?' - in Documents/NovelGrab/'+folder:' - done'):'');

const READER="<script>addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(!h||h[0]=='#')return;e.preventDefault();parent.postMessage({ng:h},'*')})<\/script>";
